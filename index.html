function attendeeLine(list) {
    const parts = list.map((a) => `${a.honor} ${a.name}, ${a.title}`);
    if (parts.length <= 1)
        return parts.join("");
    return parts.slice(0, -1).join(", ") + ", and " + parts[parts.length - 1];
}
function resolveSubject(p, sel) {
    if (p.subjectByAxis) {
        for (const ax of Object.keys(p.subjectByAxis)) {
            const v = sel[ax];
            if (v && p.subjectByAxis[ax][v])
                return p.subjectByAxis[ax][v];
        }
    }
    return p.subjectDefault;
}
function assembleBody(p, sel) {
    return p.blocks
        .filter((b) => !b.when || sel[b.when.axis] === b.when.value)
        .map((b) => b.text)
        .join("\n\n");
}

} catch (err) {
  document.getElementById('root').innerHTML='<pre style="color:#b91c1c;background:#fef2f2;padding:16px;white-space:pre-wrap;font:13px ui-monospace,monospace">실행 오류\n'+(err && err.stack ? err.stack : err)+'</pre>';
}
</script>
</body>
</html>
